# xresnet_v3.yaml — XResNet1D-50 multilabel
#
# =============================================================================
# HISTORIAL DE VERSIONES
# =============================================================================
#
# v1 (xresnet1d101, lr=1e-3, wd=1e-4, sin augment)
#   Best val AUC: 0.9133 @ ep19
#   Problema: overfitting agresivo a partir de ep20.
#             Loss train: 0.22 → 0.07 en 15 epochs.
#             Val AUC cayó de 0.9133 a 0.8845 en ep34 (early stop).
#   Hipótesis: LR alta + sin regularización de señal.
#
# v2 (xresnet1d101, lr=1e-4, wd=1e-3, augment=true)
#   Best val AUC: 0.9138 @ ep14
#   Problema: mismo patrón de overfitting, solo desplazado 5 epochs.
#             Loss train: 0.22 → 0.11 en 13 epochs.
#             Val AUC cayó de 0.9138 a 0.8968 en ep27 (detenido manualmente).
#   Conclusión: LR y weight_decay no son el cuello de botella.
#               El modelo (8.3M params) tiene demasiada capacidad para el
#               dataset (17,084 muestras de entrenamiento). Ratio ~490 params
#               por muestra → sobreajuste estructural.
#
# v3 (xresnet1d50 — 4.6M params, mitad de capacidad)
#   Cambio principal: xresnet1d101 → xresnet1d50
#     Depths: [3,4,23,3] → [3,4,6,3]
#     Params: 8.3M → 4.6M (ratio ~270 params/muestra, más razonable)
#   Mantiene los ajustes de v2 que fueron correctos:
#     - lr=1e-4 (más conservador que v1)
#     - weight_decay=1e-3 (regularización L2 más fuerte)
#     - augment=true (amplitude scaling + Gaussian noise + lead dropout)
#   Ajuste adicional:
#     - early_stopping_patience: 20 → 25 (modelo más pequeño converge más lento)
# =============================================================================

experiment:
  name: xresnet1d50_v3
  seed: 42

data:
  raw_dir: data/raw/ptb-xl
  mode: multilabel
  sampling_rate: 500
  leads: 12
  min_confidence: 0.0

model:
  architecture: xresnet1d50       # [3,4,6,3] — 4.6M params (vs 8.3M en v1/v2)
  num_classes: 5
  kernel_size: 5
  dropout: 0.5

training:
  mode: multilabel
  num_classes: 5
  epochs: 100
  batch_size: 32
  learning_rate: 1.0e-4           # conservador (v2 confirmó que 1e-3 era alto)
  weight_decay: 1.0e-3            # L2 fuerte (v2 confirmó que 1e-4 era insuficiente)
  early_stopping_patience: 25     # más margen para modelos pequeños
  use_amp: true
  gradient_clip_val: 1.0
  scheduler_name: cosine
  warmup_epochs: 3
  augment: true                   # amplitude scaling + Gaussian noise + lead dropout

logging:
  output_dir: outputs/
  checkpoint_dir: checkpoints/
