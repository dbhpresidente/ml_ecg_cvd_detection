# s4d_v2.yaml — S4D con mayor regularización y lr reducido
#
# =============================================================================
# MOTIVACION:
#   s4d_v1 (best ep13, AUC 0.8890) overfitta agresivamente desde ep14:
#   loss cae 0.19->0.09 pero AUC baja de 0.889 a 0.862.
#   Diagnóstico: dropout=0.1 y wd=1e-4 insuficientes para 1.1M params + 17k ECGs.
#
# CAMBIOS vs v1:
#   - dropout: 0.1 -> 0.3        (regularización primaria)
#   - weight_decay: 1e-4 -> 3e-4 (regularización secundaria)
#   - learning_rate: 3e-4 -> 1e-4 (lr más conservador)
#   - early_stopping_patience: 15 -> 20 (más tiempo para generalizar)
#
# RESUME:
#   Carga pesos de s4d_v1/best.pt (ep13, AUC 0.8890).
#   OneCycleLR reconstruido para epochs restantes (50-13=37).
#   Lanzar con: --resume checkpoints/s4d_v1/best.pt
# =============================================================================

experiment:
  name: s4d_v2
  seed: 42

data:
  raw_dir: data/raw/ptb-xl
  mode: multilabel
  sampling_rate: 500
  leads: 12
  min_confidence: 0.0

model:
  architecture: s4d
  num_classes: 5
  d_model: 256
  d_state: 32
  n_layers: 6
  dropout: 0.3                   # 0.1 -> 0.3: regularización agresiva
  gradient_checkpointing: true

training:
  mode: multilabel
  num_classes: 5
  epochs: 50
  batch_size: 32
  learning_rate: 1.0e-4          # 3e-4 -> 1e-4: lr más conservador
  weight_decay: 3.0e-4           # 1e-4 -> 3e-4
  early_stopping_patience: 20    # 15 -> 20
  use_amp: true
  gradient_clip_val: 1.0
  scheduler_name: onecycle
  lr_onecycle_pct_start: 0.3
  lr_onecycle_div_factor: 25.0
  augment: true
  use_pos_weight: false

logging:
  output_dir: outputs/
  checkpoint_dir: checkpoints/
