# s4d_v4.yaml — S4D con A_real estabilizado via softplus
#
# =============================================================================
# PROBLEMA EN v3:
#   loss=nan desde ep42. A_real derivó a valores positivos durante training,
#   causando exp(A_real * dt * l) → inf para l=5000 (Vandermonde explosion).
#   Best fue ep11, AUC 0.8933 — truncado por divergencia.
#
# FIX:
#   src/models/s4d.py: A_r = -F.softplus(self.A_real) en lugar de A_r = self.A_real
#   Garantiza A_real < 0 siempre (condición de estabilidad SSM).
#
# CAMBIOS vs v3:
#   - A_real ahora siempre negativo (fix NaN)
#   - lr: 1e-3 → 5e-4 (más conservador, margen extra)
#   - Todo lo demás igual: d_model=128, d_state=8, n_layers=4, 200ep cosine
# =============================================================================

experiment:
  name: s4d_v4
  seed: 42

data:
  raw_dir: data/raw/ptb-xl
  mode: multilabel
  sampling_rate: 500
  leads: 12
  min_confidence: 0.0

model:
  architecture: s4d
  num_classes: 5
  d_model: 128
  d_state: 8
  n_layers: 4
  dropout: 0.1
  gradient_checkpointing: false

training:
  mode: multilabel
  num_classes: 5
  epochs: 200
  batch_size: 32
  learning_rate: 5.0e-4          # 1e-3 → 5e-4: más conservador
  weight_decay: 1.0e-4
  early_stopping_patience: 40
  use_amp: true
  gradient_clip_val: 1.0
  scheduler_name: cosine
  warmup_epochs: 5
  augment: true
  use_pos_weight: false

logging:
  output_dir: outputs/
  checkpoint_dir: checkpoints/
