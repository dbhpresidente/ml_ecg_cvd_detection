# xresnet_v10.yaml — xresnet1d50 sin filtros + label smoothing ε=0.1
#
# =============================================================================
# HIPÓTESIS:
#   El desbalance de clases (HYP=2,649 vs NORM=9,514) lleva al modelo a
#   sobreajustar las clases grandes. Label smoothing (ε=0.1) suaviza los
#   targets de 0/1 → 0.05/0.95, penalizando predicciones overconfident.
#   Efecto esperado: mejor calibración, mejora en clases minoritarias (HYP).
#
# PREREQUISITO: v8 debe confirmar que sin bandpass mejora la baseline.
#
# CAMBIOS vs v8:
#   + label_smoothing: 0.1
#   = todo lo demás igual que v8
# =============================================================================

experiment:
  name: xresnet_v10
  seed: 42

data:
  raw_dir: data/raw/ptb-xl
  mode: multilabel
  sampling_rate: 500
  leads: 12
  min_confidence: 0.0
  bandpass: false
  notch: false
  normalization: zscore

model:
  architecture: xresnet1d50
  num_classes: 5
  kernel_size: 5
  dropout: 0.5

training:
  mode: multilabel
  num_classes: 5
  epochs: 50
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  early_stopping_patience: 15
  use_amp: true
  gradient_clip_val: 1.0
  scheduler_name: onecycle
  lr_onecycle_pct_start: 0.3
  lr_onecycle_div_factor: 25.0
  augment: true
  use_pos_weight: false
  label_smoothing: 0.1

logging:
  output_dir: outputs/
  checkpoint_dir: checkpoints/
