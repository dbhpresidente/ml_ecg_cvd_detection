# xresnet_v6.1.yaml — igual que v6 pero early_stopping_patience: 25
#
# v6 paro en ep18 (best=0.9174) con patience=15.
# El LR estaba en 4.7e-4 en ep33 — aun en la mitad de la fase de descenso.
# Con patience=25 el modelo puede seguir hasta ep43+ y aprovechar
# el regimen de LR bajo (1e-4 -> 1e-7) donde esperamos el best real.

experiment:
  name: xresnet1d50_v6_1
  seed: 42

data:
  raw_dir: data/raw/ptb-xl
  mode: multilabel
  sampling_rate: 500
  leads: 12
  min_confidence: 0.0

model:
  architecture: xresnet1d50
  num_classes: 5
  kernel_size: 5
  dropout: 0.5

training:
  mode: multilabel
  num_classes: 5
  epochs: 50
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  early_stopping_patience: 25     # v6 tenia 15 — demasiado corto para OneCycleLR
  use_amp: true
  gradient_clip_val: 1.0
  scheduler_name: onecycle
  lr_onecycle_pct_start: 0.3
  lr_onecycle_div_factor: 25.0
  augment: true
  use_pos_weight: false

logging:
  output_dir: outputs/
  checkpoint_dir: checkpoints/
