# s4d_v1.yaml — S4D Diagonal State Space Model (baseline run)
#
# =============================================================================
# MOTIVACION:
#   xresnet (v6-v7.1) alcanza techo ~0.917 en PTB-XL superclasses.
#   Gap residual vs benchmark (0.936) requiere arquitectura diferente.
#
#   S4D-Lin (Gu et al., NeurIPS 2022):
#     - Modela dependencias de largo alcance via SSM diagonal
#     - 0.941 AUC reportado en PTB-XL superclasses (multilabel)
#     - 2.2M params — mas eficiente que xresnet1d101 (8.3M)
#     - Complejidad O(L log L) via FFT — apto para L=5000
#
# CONFIG v1 — baseline conservador:
#   d_model=256, d_state=64, n_layers=6, dropout=0.1
#   OneCycleLR con lr mas bajo que xresnet (SSM requiere lr menor, lr=3e-4)
#   Ritmo estimado: 6-12 min/epoch en GTX 1070 (FFT L=5000, batch=32)
# =============================================================================

experiment:
  name: s4d_v1
  seed: 42

data:
  raw_dir: data/raw/ptb-xl
  mode: multilabel
  sampling_rate: 500
  leads: 12
  min_confidence: 0.0

model:
  architecture: s4d
  num_classes: 5
  d_model: 256
  d_state: 32              # 64 overflow VRAM: Vandermonde (256,64,5000) x8 intermediates = ~15GB
  n_layers: 6
  dropout: 0.1
  gradient_checkpointing: true  # recomputa intermediarios en backward — VRAM 15GB->~2GB

training:
  mode: multilabel
  num_classes: 5
  epochs: 50
  batch_size: 32
  learning_rate: 3.0e-4          # SSM necesita lr menor que CNN (3e-4 vs 1e-3)
  weight_decay: 1.0e-4
  early_stopping_patience: 15
  use_amp: true
  gradient_clip_val: 1.0
  scheduler_name: onecycle
  lr_onecycle_pct_start: 0.3
  lr_onecycle_div_factor: 25.0
  augment: true
  use_pos_weight: false

logging:
  output_dir: outputs/
  checkpoint_dir: checkpoints/
